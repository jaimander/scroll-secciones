
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drag Velocity Detector</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="container">

    <div class="info">
      <span>VELOCIDAD DEL DRAG</span>
      <h1 id="velocity">0</h1>
      <span>PX / SEGUNDO</span>

      <div class="status" id="status">
        Esperando movimiento...
      </div>
    </div>

    <div class="drag-area" id="dragArea">
      <span>ARRASTRA AQUÍ</span>
    </div>

  </main>

  <script>
    const dragArea = document.getElementById("dragArea");
    const velocityDisplay = document.getElementById("velocity");
    const statusDisplay = document.getElementById("status");

    let isDragging = false;
    let lastY = 0;
    let lastTime = 0;
    let velocity = 0;

    const THRESHOLD = 1000;

    function startDrag(y) {
      isDragging = true;
      lastY = y;
      lastTime = performance.now();
      velocity = 0;
    }

    function moveDrag(y) {
      if (!isDragging) return;

      const now = performance.now();
      const deltaY = y - lastY;
      const deltaTime = now - lastTime;

      if (deltaTime > 0) {
        velocity = Math.abs(deltaY / deltaTime) * 1000;

        velocityDisplay.textContent = Math.round(velocity);

        if (velocity > THRESHOLD) {
          statusDisplay.textContent = "MOVIMIENTO RÁPIDO";
          statusDisplay.className = "status fast";
        } else {
          statusDisplay.textContent = "MOVIMIENTO LENTO";
          statusDisplay.className = "status slow";
        }
      }

      lastY = y;
      lastTime = now;
    }

    function endDrag() {
      isDragging = false;
      velocity = 0;
      velocityDisplay.textContent = "0";
      statusDisplay.textContent = "Drag finalizado";
      statusDisplay.className = "status";
    }

    // Mouse
    dragArea.addEventListener("mousedown", (e) => {
      startDrag(e.clientY);
    });

    window.addEventListener("mousemove", (e) => {
      moveDrag(e.clientY);
    });

    window.addEventListener("mouseup", endDrag);

    // Touch
    dragArea.addEventListener("touchstart", (e) => {
      startDrag(e.touches[0].clientY);
    }, { passive: true });

    dragArea.addEventListener("touchmove", (e) => {
      moveDrag(e.touches[0].clientY);
    }, { passive: true });

    dragArea.addEventListener("touchend", endDrag);
    dragArea.addEventListener("touchcancel", endDrag);

  </script>

</body>
</html>
